<meta name="theme-color" content="#1a4b9b">
<style>
:root{
  --bleu:#1a4b9b; --bleu-f:#123a7a; --jaune:#f3c623; --rouge:#c61f26;
  --argent:#c9cdd2; --gris:#eef0f3; --texte:#1f2328; --doux:#5b6470;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texte);
  background:#f1f3f6;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.bandeau{height:6px;background:linear-gradient(90deg,var(--bleu) 0 33.3%,var(--jaune) 33.3% 66.6%,var(--rouge) 66.6%)}
.haut{display:flex;align-items:center;gap:10px;padding:8px 16px 6px;max-width:1200px;margin:0 auto}
.haut img{width:56px;height:56px;object-fit:contain}
.haut h1{margin:0;font-size:21px;font-weight:800;color:var(--bleu);letter-spacing:.2px;flex:1}
.haut h1 span{color:var(--rouge)}
.filtres{display:flex;gap:8px;padding:0 16px 10px;max-width:1200px;margin:0 auto;overflow-x:auto}
.filtres button{flex:1 0 auto;border:2px solid var(--bleu);background:#fff;color:var(--bleu);font-weight:700;font-size:14px;
  padding:8px 12px;border-radius:999px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.filtres button.on{background:var(--bleu);color:#fff;box-shadow:inset 0 -3px 0 var(--jaune)}
main{max-width:1200px;margin:0 auto;padding:14px 16px 30px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));align-items:start}
.aide{grid-column:1/-1;margin:0;font-size:12.5px;color:var(--doux);text-align:center}
section.compo{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(18,58,122,.10);overflow:hidden;border:1px solid #e3e6ea}
section.compo[hidden]{display:none}
.titre{background:var(--bleu);color:#fff;padding:10px 14px;font-size:18px;font-weight:800;border-bottom:4px solid var(--jaune);
  display:flex;align-items:center;justify-content:space-between}
.titre small{font-weight:600;font-size:12px;opacity:.85}
.sous{margin:14px 12px 4px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--rouge);
  display:flex;align-items:center;gap:8px}
.sous::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--argent),transparent)}
.terrain{padding:4px 8px 12px}
.ligne{display:flex;justify-content:center;gap:4px;margin:2px 0}
.grille{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px 8px 12px}
.slot{max-width:120px;flex:0 0 calc(33.333% - 3px);display:flex;flex-direction:column;align-items:center;
  padding:4px 2px 6px;border-radius:12px;position:relative;touch-action:manipulation;background:#fff;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.edition .slot{cursor:grab}
.grille .slot{max-width:none;flex:none}
.num{font-size:18px;font-weight:900;color:var(--rouge);line-height:1;margin-bottom:3px;min-height:18px}
.carte{position:relative;width:86px;height:96px;display:flex;align-items:flex-end;justify-content:center}
.carte img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.carte img.maillot{width:66px;height:auto;margin-bottom:4px}
.un,.cap{position:absolute;top:0;width:24px;height:24px;border-radius:50%;font-weight:800;font-size:14px;line-height:21px;
  text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.un{left:2px;background:#e6e6e6;border:1.5px solid #4a4a4a;color:#333}
.cap{right:2px;background:var(--jaune);border:1.5px solid var(--bleu);color:var(--bleu)}
.nom{font-size:13px;font-weight:800;line-height:1.15;text-align:center;margin-top:2px;word-break:break-word}
.cmt{font-size:10px;line-height:1.2;color:var(--doux);text-align:center;margin-top:2px;max-width:100%;word-break:break-word;font-style:italic}
.vide .carte{border:2px dashed var(--argent);border-radius:12px;width:72px;height:88px;align-items:center;color:var(--argent);font-size:28px;font-weight:300}
body.edition .vide{cursor:pointer}
.ajout .carte{border-color:#9fb4d6;color:#9fb4d6}
body:not(.edition) .ajout{display:none}
.cible{outline:3px solid var(--jaune);box-shadow:0 0 0 6px rgba(243,198,35,.35)}
.source{opacity:.35}
.fantome{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-60%) scale(1.12);filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.fantome .slot{max-width:none;width:100%}
body.glisse{cursor:grabbing;overflow:hidden;touch-action:none}
footer{text-align:center;padding:4px 16px 36px;display:flex;flex-direction:column;align-items:center;gap:10px}
footer button{background:none;border:1px solid var(--argent);color:var(--doux);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
footer button[hidden]{display:none}
#statut{font-size:12px;color:var(--doux)}
/* fenêtres */
dialog{border:none;border-radius:18px;padding:0;width:min(92vw,380px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,25,55,.55)}
.dlg-t{background:var(--bleu);color:#fff;padding:12px 16px;font-weight:800;font-size:17px;border-bottom:4px solid var(--jaune)}
.dlg-c{padding:14px 16px;display:grid;gap:12px}
.dlg-c label{font-size:13px;font-weight:700;color:var(--doux);display:grid;gap:5px}
.dlg-c input[type=text],.dlg-c input[type=email],.dlg-c input[type=password]{font-size:16px;padding:9px 10px;border:1.5px solid #cfd5dd;border-radius:10px;width:100%}
.photo-zone{display:flex;align-items:center;gap:12px}
.photo-zone .apercu{width:72px;height:80px;border-radius:10px;background:#fff;border:1px solid #e3e6ea;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.photo-zone .apercu img{max-width:100%;max-height:100%;object-fit:contain}
.photo-zone div.btns{display:grid;gap:6px}
.btn{border:none;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700;cursor:pointer}
.btn.p{background:var(--bleu);color:#fff}
.btn.s{background:var(--gris);color:var(--texte)}
.btn.d{background:#fff;color:var(--rouge);border:1.5px solid var(--rouge)}
.btn[hidden]{display:none}
.case{display:flex !important;align-items:center;gap:10px;font-size:15px !important;color:var(--texte) !important}
.case input{width:22px;height:22px;accent-color:var(--bleu);margin:0}
.case .un,.case .cap{position:static;display:inline-block;flex:none}
.dlg-b{display:flex;gap:8px;padding:0 16px 16px;flex-wrap:wrap}
.dlg-b .btn{flex:1}
.dlg-b .btn.d{flex-basis:100%}
</style>
</head>
<body>

/* ---------- Lecture / écriture d'un emplacement ---------- */
// emplacements : "xv:5", "x:9", "xr:12" (postes) ; "bl:2", "in:0" (listes) ; "bl:+", "in:+" (case d'ajout)
function lire(loc){
  const [g,i]=loc.split(":");
  if(g==="bl"||g==="in") return i==="+"?null:etat[g][+i]??null;
  return etat.postes[loc]??null;
}
function ecrire(loc,id){
  const [g,i]=loc.split(":");
  if(g==="bl"||g==="in"){
    if(i==="+"){ if(id) etat[g].push(id); }
    else if(id) etat[g][+i]=id; else etat[g].splice(+i,1);
  } else etat.postes[loc]=id;
}
function deplacer(de,vers){
  if(de===vers) return;
  const a=lire(de), b=lire(vers);
  if(!a) return;
  const [gv,iv]=vers.split(":");
  if(iv==="+"){ ecrire(de,null); etat[gv].push(a); }   // dépôt dans la case d'ajout d'une liste
  else { ecrire(vers,a); ecrire(de,b); }               // poste vide : déplacement ; poste pris : échange
  sauver();
}

/* ---------- Affichage ---------- */
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function srcPhoto(p){
  if(!p) return "";
  if(p.startsWith("img:")) return IMG[p.slice(4)]||"";
  if(p.startsWith("p:")) return PH[p.slice(2)]||"";
  return p; // image pas encore envoyée (fenêtre d'édition)
}
function htmlSlot(loc,num){
  const id=lire(loc), j=id&&etat.joueuses[id];
  const n=num!=null?`<div class="num">${num}</div>`:"";
  if(!j){
    const plus=loc.endsWith(":+");
    return `<div class="slot vide${plus?" ajout":""}" data-loc="${loc}">${n}<div class="carte">${peutModifier()?"+":""}</div>${plus?'<div class="cmt">ajouter</div>':""}</div>`;
  }
  const src=srcPhoto(j.photo);
  const img=src?`<img src="${src}" alt="${esc(j.nom)}" draggable="false">`:`<img class="maillot" src="${MAILLOT}" alt="" draggable="false">`;
  return `<div class="slot plein" data-loc="${loc}">${n}<div class="carte">${img}${j.un?'<span class="un">1</span>':""}${j.cap?'<span class="cap">C</span>':""}</div>`+
    (src?"":`<div class="nom">${esc(j.nom)||"&nbsp;"}</div>`)+(j.cmt?`<div class="cmt">${esc(j.cmt)}</div>`:"")+`</div>`;
}
let enAttente=false;
function dessiner(){
  if(glisse){ enAttente=true; return; }   // pas de rafraîchissement pendant un déplacement
  enAttente=false;
  for(const [zone,lignes] of Object.entries(DISPO))
    $(zone).innerHTML=lignes.map(l=>`<div class="ligne">${l.map(([loc,n])=>htmlSlot(loc,n)).join("")}</div>`).join("");
  for(const g of ["bl","in"])
    $(g).innerHTML=etat[g].map((_,i)=>htmlSlot(g+":"+i)).join("")+htmlSlot(g+":+");
  const compte=p=>Object.keys(etat.postes).filter(k=>k.startsWith(p)&&etat.postes[k]).length;
  $("c-xv").textContent=compte("xv:")+" joueuses";
  $("c-x").textContent=(compte("x:")+compte("xr:"))+" joueuses";
}

/* ---------- Appui long pour déplacer, double-tape pour modifier ---------- */
const APPUI=380, BOUGE=10;
let appui=null, glisse=null, dernierTap={loc:null,t:0}, dernierTouch=0;

function debut(x,y,slot,tactile){
  annulerAppui();
  appui={x,y,slot,loc:slot.dataset.loc,tactile,timer:null};
  if(slot.classList.contains("plein"))
    appui.timer=setTimeout(()=>commencerGlisse(x,y),APPUI);
}
function annulerAppui(){ if(appui&&appui.timer) clearTimeout(appui.timer); appui=null; }
function commencerGlisse(x,y){
  if(!appui) return;
  const slot=appui.slot;
  const f=document.createElement("div"); f.className="fantome";
  f.innerHTML=slot.outerHTML;
  f.style.width=slot.offsetWidth+"px";
  document.body.appendChild(f);
  slot.classList.add("source"); document.body.classList.add("glisse");
  glisse={de:appui.loc,f,x,y,cible:null,raf:0};
  appui.timer=null;
  try{ navigator.vibrate&&navigator.vibrate(25); }catch(e){}
  bouger(x,y); defilement();
}
function bouger(x,y){
  glisse.x=x; glisse.y=y;
  glisse.f.style.left=x+"px"; glisse.f.style.top=y+"px";
  const el=document.elementFromPoint(x,y), s=el&&el.closest("main .slot");
  const c=s&&s.dataset.loc!==glisse.de?s:null;
  if(glisse.cible!==c){ glisse.cible&&glisse.cible.classList.remove("cible"); c&&c.classList.add("cible"); glisse.cible=c; }
}
function defilement(){ // défile la page quand le doigt approche du haut ou du bas
  if(!glisse) return;
  const h=window.innerHeight, m=70; let v=0;
  if(glisse.y<m+90) v=-Math.ceil((m+90-glisse.y)/6); else if(glisse.y>h-m) v=Math.ceil((glisse.y-(h-m))/6);
  if(v){ window.scrollBy(0,v); bouger(glisse.x,glisse.y); }
  glisse.raf=requestAnimationFrame(defilement);
}
function finGlisse(deposer){
  cancelAnimationFrame(glisse.raf);
  const {de,cible,f}=glisse; f.remove(); document.body.classList.remove("glisse");
  document.querySelectorAll(".source,.cible").forEach(e=>e.classList.remove("source","cible"));
  glisse=null; appui=null;
  if(deposer&&cible) deplacer(de,cible.dataset.loc);
  else if(enAttente) dessiner();
}
function tap(loc){
  const t=Date.now();
  if(dernierTap.loc===loc&&t-dernierTap.t<350){ dernierTap={loc:null,t:0}; ouvrir(loc); }
  else dernierTap={loc,t};
}
const slotModifiable=t=>peutModifier()&&t.closest&&t.closest("main .slot");

// Tactile
document.addEventListener("touchstart",e=>{
  if(e.touches.length>1){ annulerAppui(); return; }
  const s=slotModifiable(e.target); if(!s) return;
  const t=e.touches[0]; debut(t.clientX,t.clientY,s,true); dernierTouch=Date.now();
},{passive:true});
document.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  if(glisse){ e.preventDefault(); bouger(t.clientX,t.clientY); return; }
  if(appui&&Math.hypot(t.clientX-appui.x,t.clientY-appui.y)>BOUGE) annulerAppui();
},{passive:false});
document.addEventListener("touchend",e=>{
  dernierTouch=Date.now();
  if(glisse){ e.preventDefault(); finGlisse(true); return; }
  if(appui){ const loc=appui.loc; annulerAppui(); e.preventDefault(); tap(loc); }
},{passive:false});
document.addEventListener("touchcancel",()=>{ if(glisse) finGlisse(false); annulerAppui(); });

// Souris (ordinateur)
document.addEventListener("mousedown",e=>{
  if(e.button!==0||Date.now()-dernierTouch<800) return;
  const s=slotModifiable(e.target); if(!s) return;
  e.preventDefault(); debut(e.clientX,e.clientY,s,false);
});
document.addEventListener("mousemove",e=>{
  if(glisse){ bouger(e.clientX,e.clientY); return; }
  if(appui&&!appui.tactile&&appui.timer&&Math.hypot(e.clientX-appui.x,e.clientY-appui.y)>BOUGE){
    clearTimeout(appui.timer); commencerGlisse(e.clientX,e.clientY); // à la souris, on peut aussi glisser directement
  }
});
document.addEventListener("mouseup",()=>{ if(glisse) finGlisse(true); else annulerAppui(); });
document.addEventListener("dblclick",e=>{
  if(Date.now()-dernierTouch<800) return;
  const s=slotModifiable(e.target); if(s) ouvrir(s.dataset.loc);
});
document.addEventListener("contextmenu",e=>{ if(slotModifiable(e.target)) e.preventDefault(); });

/* ---------- Fenêtre d'édition ---------- */
const dlg=$("dlg");
let edition=null; // {loc,id,photo}
function apercu(){
  const src=srcPhoto(edition.photo);
  $("f-apercu").innerHTML=src?`<img src="${src}" alt="">`:`<img src="${MAILLOT}" alt="" style="width:56px;margin-bottom:6px">`;
  $("f-sans").hidden=!src;
}
function ouvrir(loc){
  if(!peutModifier()) return;
  const id=lire(loc), j=id?etat.joueuses[id]:null;
  edition={loc,id,photo:j?j.photo:""};
  $("dlg-t").textContent=j?(j.nom||"Joueuse"):"Nouvelle joueuse";
  $("f-nom").value=j?j.nom:""; $("f-cmt").value=j?j.cmt:"";
  $("f-un").checked=j?!!j.un:false; $("f-cap").checked=j?!!j.cap:false;
  $("f-suppr").hidden=!j;
  apercu(); dlg.showModal();
}
$("f-annuler").onclick=()=>dlg.close();
$("f-photo").onclick=()=>$("f-fichier").click();
$("f-sans").onclick=()=>{ edition.photo=""; apercu(); };
$("f-fichier").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ edition.photo=await reduire(f); apercu(); }catch(err){ alert("Impossible de lire cette image."); }
};
$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const ed=edition, ok=$("f-ok"); ok.disabled=true;
  try{
    let photo=ed.photo;
    const ancienne=ed.id?etat.joueuses[ed.id].photo:"";
    if(photo.startsWith("data:")){                     // nouvelle photo : envoyée à part
      const pid="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      PH[pid]=photo;
      if(partage) await base.envoyerPhoto(pid,photo);
      photo="p:"+pid;
    }
    const d={nom:$("f-nom").value.trim(),cmt:$("f-cmt").value.trim(),un:$("f-un").checked,cap:$("f-cap").checked,photo};
    if(ed.id) Object.assign(etat.joueuses[ed.id],d);
    else{ const id="n"+Date.now().toString(36); etat.joueuses[id]=d; ecrire(ed.loc,id); }
    if(ancienne!==photo) oublierPhoto(ancienne);
    dlg.close(); await sauver();
  }catch(err){ alert("Enregistrement impossible ("+(err.code||err.message)+")."); }
  finally{ ok.disabled=false; }
});
$("f-suppr").onclick=async()=>{
  const j=etat.joueuses[edition.id];
  if(!confirm(`Supprimer ${j.nom||"cette joueuse"} de la composition ?`)) return;
  ecrire(edition.loc,null); delete etat.joueuses[edition.id]; oublierPhoto(j.photo);
  dlg.close(); await sauver();
};
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); });
function oublierPhoto(p){
  if(!p||!p.startsWith("p:")) return;
  const pid=p.slice(2); delete PH[pid];
  if(partage&&base) base.supprimerPhoto(pid).catch(()=>{});
}

// Réduit la photo choisie (220 px de haut, JPEG sur fond blanc) : lisible sur tous les téléphones
function reduire(fichier){
  return new Promise((ok,ko)=>{
    const url=URL.createObjectURL(fichier), im=new Image();
    im.onload=()=>{
      const H=220, r=Math.min(1,H/im.naturalHeight), w=Math.round(im.naturalWidth*r), h=Math.round(im.naturalHeight*r);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,w,h); g.drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg",0.75));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);ko();};
    im.src=url;
  });
}

$("reset").onclick=async()=>{
  if(!confirm("Revenir à la composition d'origine ? Toutes les modifications (déplacements, photos, textes) seront perdues"+(partage?" sur tous les téléphones.":"."))) return;
  for(const pid of Object.keys(PH)) oublierPhoto("p:"+pid);
  etat=origine(); await sauver();
};

/* ---------- Démarrage ---------- */
appliquerFiltres(); majMode();

if(partage){
  statut("Connexion à la base…");
  try{
    const V="https://www.gstatic.com/firebasejs/10.12.2/";
    const { initializeApp } = await import(V+"firebase-app.js");
    const { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot, serverTimestamp } = await import(V+"firebase-firestore.js");
    const app=initializeApp(FIREBASE,"compo-u93"), db=getFirestore(app);
    base={
      enregistrer:e=>setDoc(doc(db,"compoU93","etat"),{...e,maj:serverTimestamp()}),
      envoyerPhoto:(pid,d)=>setDoc(doc(db,"compoU93Photos",pid),{d}),
      supprimerPhoto:pid=>deleteDoc(doc(db,"compoU93Photos",pid)),
    };
    onSnapshot(doc(db,"compoU93","etat"),s=>{
      if(s.exists()){ const d=s.data(); etat={joueuses:d.joueuses||{},postes:d.postes||{},bl:d.bl||[],in:d.in||[]}; }
      else etat=origine();
      cache(); dessiner(); statut("Compositions à jour");
    },err=>statut("Base inaccessible ("+err.code+") : affichage de la dernière version connue"));
    onSnapshot(collection(db,"compoU93Photos"),s=>{
      const p={}; s.forEach(d=>p[d.id]=d.data().d);
      for(const [k,v] of Object.entries(PH)) if(!(k in p)&&v&&v.startsWith("data:")&&s.metadata.hasPendingWrites) p[k]=v;
      PH=p; cache(); dessiner();
    },()=>{});
  }catch(e){ statut("Hors ligne : affichage de la dernière version connue"); }
} else statut("Modifications enregistrées sur ce téléphone");
</script>
